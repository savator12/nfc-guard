<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>

  <!-- Signal / Radar ripples -->
  <path d="M 160 110 A 130 130 0 0 1 352 110" fill="none" stroke="#93c5fd" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <path d="M 195 140 A 80 80 0 0 1 317 140" fill="none" stroke="#bfdbfe" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- Outer Shield -->
  <path d="M 256 120 L 396 170 C 396 300 256 420 256 420 C 256 420 116 300 116 170 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Inner Shield outline -->
  <path d="M 256 148 L 368 190 C 368 290 256 388 256 388 C 256 388 144 290 144 190 Z" 
        fill="#172554" opacity="0.85"/>

  <!-- Padlock Shackle -->
  <path d="M 216 260 V 230 C 216 205 234 185 256 185 C 278 185 296 205 296 230 V 260" 
        fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="190" y="250" width="132" height="110" rx="22" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Padlock Keyhole -->
  <circle cx="256" cy="295" r="14" fill="#0f172a"/>
  <polygon points="250,295 262,295 265,335 247,335" fill="#0f172a"/>
</svg>
